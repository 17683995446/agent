agent:
  heartbeat_interval: 10
  max_concurrent_tasks: 3
  optimize_interval: 5
  restart_on_error: true
  task_queue_size: 100
  task_retry_limit: 3
  task_timeout: 300
knowledge:
  auto_save_interval: 30
  db_path: data/knowledge.db
llm:
  api_key: ''
  base_url: https://api.openai.com/v1
  max_tokens: 2048
  model: gpt-4o-mini
  provider: openai
  temperature: 0.7
  timeout: 60
logging:
  level: INFO
  log_dir: logs
